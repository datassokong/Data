<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Telemedicine Dashboard – อำเภอกงไกรลาศ</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  :root {
    --accent1:#6c63ff;--accent2:#00c6ff;--accent3:#43e97b;--accent4:#f7971e;
    --glass-bg:rgba(255,255,255,0.07);--glass-border:rgba(255,255,255,0.15);
    --text-white:#ffffff;--text-muted:rgba(255,255,255,0.55);
    --shadow:0 8px 32px rgba(0,0,0,0.35);--radius:24px;--radius-sm:14px;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Sarabun',sans-serif;background:linear-gradient(135deg,#0d0a2e 0%,#111854 40%,#1a2a6c 70%,#0a3d6b 100%);min-height:100vh;color:var(--text-white);overflow-x:hidden}
  body::before,body::after{content:'';position:fixed;border-radius:50%;filter:blur(90px);z-index:0;pointer-events:none}
  body::before{width:520px;height:520px;background:radial-gradient(circle,rgba(108,99,255,0.25),transparent 70%);top:-120px;left:-100px;animation:orb1 12s ease-in-out infinite alternate}
  body::after{width:400px;height:400px;background:radial-gradient(circle,rgba(0,198,255,0.2),transparent 70%);bottom:-80px;right:-60px;animation:orb2 15s ease-in-out infinite alternate}
  @keyframes orb1{to{transform:translate(60px,40px) scale(1.1)}}
  @keyframes orb2{to{transform:translate(-40px,-60px) scale(1.15)}}
  .wrapper{position:relative;z-index:1;max-width:1200px;margin:0 auto;padding:24px 16px 48px}
  .header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px;background:var(--glass-bg);border:1px solid var(--glass-border);backdrop-filter:blur(20px);border-radius:var(--radius);padding:22px 32px;margin-bottom:28px;box-shadow:var(--shadow)}
  .header-left{display:flex;align-items:center;gap:16px}
  .logo-icon{width:52px;height:52px;background:linear-gradient(135deg,var(--accent1),var(--accent2));border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:26px;box-shadow:0 4px 18px rgba(108,99,255,0.45);flex-shrink:0}
  .header-title h1{font-size:clamp(1.1rem,3vw,1.55rem);font-weight:800;letter-spacing:-0.3px}
  .header-title p{font-size:0.82rem;color:var(--text-muted);margin-top:2px}
  .header-right{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .date-badge{background:rgba(0,198,255,0.12);border:1px solid rgba(0,198,255,0.3);border-radius:999px;padding:6px 18px;font-size:0.82rem;color:var(--accent2);font-weight:600}
  .refresh-btn{background:linear-gradient(135deg,var(--accent1),var(--accent2));border:none;border-radius:999px;color:#fff;font-family:'Sarabun',sans-serif;font-size:0.82rem;font-weight:700;padding:8px 22px;cursor:pointer;transition:opacity .2s,transform .15s;box-shadow:0 4px 16px rgba(108,99,255,0.4)}
  .refresh-btn:hover{opacity:.88;transform:translateY(-1px)}
  .tab-bar{display:flex;gap:10px;margin-bottom:28px;background:var(--glass-bg);border:1px solid var(--glass-border);backdrop-filter:blur(16px);border-radius:var(--radius);padding:8px;box-shadow:var(--shadow)}
  .tab-btn{flex:1;border:none;cursor:pointer;border-radius:var(--radius-sm);padding:12px 10px;font-family:'Sarabun',sans-serif;font-size:0.9rem;font-weight:700;transition:all .25s;display:flex;align-items:center;justify-content:center;gap:8px;background:transparent;color:var(--text-muted)}
  .tab-btn.active{background:linear-gradient(135deg,var(--accent1),var(--accent2));color:#fff;box-shadow:0 4px 20px rgba(108,99,255,0.45)}
  .tab-btn:not(.active):hover{background:rgba(255,255,255,0.08);color:#fff}
  .panel{display:none;animation:fadeIn .4s ease}.panel.active{display:block}
  @keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
  .summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:18px;margin-bottom:28px}
  .summary-card{background:var(--glass-bg);border:1px solid var(--glass-border);backdrop-filter:blur(18px);border-radius:var(--radius);padding:24px 22px;box-shadow:var(--shadow);transition:transform .2s,box-shadow .2s;position:relative;overflow:hidden}
  .summary-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;border-radius:var(--radius) var(--radius) 0 0}
  .summary-card.c1::before{background:linear-gradient(90deg,var(--accent1),var(--accent2))}
  .summary-card.c2::before{background:linear-gradient(90deg,var(--accent2),var(--accent3))}
  .summary-card.c3::before{background:linear-gradient(90deg,var(--accent3),var(--accent4))}
  .summary-card.c4::before{background:linear-gradient(90deg,var(--accent4),var(--accent1))}
  .summary-card:hover{transform:translateY(-4px);box-shadow:0 16px 40px rgba(0,0,0,0.4)}
  .card-icon{font-size:1.8rem;margin-bottom:10px}
  .card-label{font-size:0.78rem;color:var(--text-muted);font-weight:600;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px}
  .card-value{font-size:2rem;font-weight:800;line-height:1}
  .card-delta{display:inline-block;font-size:0.78rem;font-weight:700;margin-top:8px;padding:3px 10px;border-radius:999px}
  .delta-up{background:rgba(67,233,123,0.15);color:var(--accent3)}
  .delta-down{background:rgba(253,99,107,0.15);color:#fd636b}
  .card-sub{font-size:0.72rem;color:var(--text-muted);margin-top:6px}
  .section-title{display:flex;align-items:center;gap:10px;font-size:1rem;font-weight:700;margin-bottom:16px;color:var(--accent2)}
  .section-title::after{content:'';flex:1;height:1px;background:var(--glass-border)}
  .chart-card{background:var(--glass-bg);border:1px solid var(--glass-border);backdrop-filter:blur(18px);border-radius:var(--radius);padding:28px 24px;box-shadow:var(--shadow);margin-bottom:28px}
  .chart-card canvas{max-height:340px}
  .table-card{background:var(--glass-bg);border:1px solid var(--glass-border);backdrop-filter:blur(18px);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);margin-bottom:28px}
  .table-card table{width:100%;border-collapse:collapse}
  .table-card thead tr{background:rgba(108,99,255,0.18)}
  .table-card th{padding:14px 18px;text-align:left;font-size:0.78rem;font-weight:700;color:var(--accent2);text-transform:uppercase;letter-spacing:0.5px;line-height:1.4}
  .table-card td{padding:13px 18px;font-size:0.88rem;border-top:1px solid rgba(255,255,255,0.05)}
  .table-card tbody tr{transition:background .15s}
  .table-card tbody tr:hover{background:rgba(255,255,255,0.05)}
  .tag-up{display:inline-block;padding:2px 9px;border-radius:999px;font-size:.75rem;font-weight:700;background:rgba(67,233,123,0.15);color:var(--accent3)}
  .tag-down{display:inline-block;padding:2px 9px;border-radius:999px;font-size:.75rem;font-weight:700;background:rgba(253,99,107,0.15);color:#fd636b}
  .tag-zero{display:inline-block;padding:2px 9px;border-radius:999px;font-size:.75rem;font-weight:600;background:rgba(255,255,255,0.06);color:var(--text-muted)}
  .loading-state{text-align:center;padding:60px 20px;color:var(--text-muted);font-size:1rem}
  .spinner{width:44px;height:44px;border:4px solid rgba(255,255,255,0.1);border-top-color:var(--accent2);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .debug-box{background:rgba(255,165,0,0.1);border:1px solid rgba(255,165,0,0.35);border-radius:var(--radius-sm);padding:14px 18px;font-size:0.76rem;color:rgba(255,200,100,0.9);margin-bottom:16px;font-family:monospace;white-space:pre-wrap;word-break:break-all;max-height:220px;overflow-y:auto}
  .footer{text-align:center;font-size:.75rem;color:var(--text-muted);margin-top:36px;padding-top:20px;border-top:1px solid rgba(255,255,255,0.07)}
  @media(max-width:520px){.header{padding:16px 18px}.chart-card,.table-card{padding:18px 10px}.table-card th,.table-card td{padding:11px 10px}}
</style>
</head>
<body>
<div class="wrapper">
  <div class="header">
    <div class="header-left">
      <div class="logo-icon">🏥</div>
      <div class="header-title">
        <h1>Telemedicine Dashboard</h1>
        <p>เฉพาะเครือข่ายอำเภอกงไกรลาศ · จังหวัดสุโขทัย</p>
      </div>
    </div>
    <div class="header-right">
      <div class="date-badge" id="dateBadge">⏳ กำลังโหลด…</div>
      <button class="refresh-btn" onclick="loadAllData()">🔄 รีเฟรช</button>
    </div>
  </div>

  <div class="tab-bar">
    <button class="tab-btn active" onclick="switchTab('hdc',this)">📊 ข้อมูล HDC (API)</button>
    <button class="tab-btn" onclick="switchTab('ksp',this)">🗂️ ข้อมูล กสป</button>
  </div>

  <div class="panel active" id="panel-hdc">
    <div id="hdc-content">
      <div class="loading-state"><div class="spinner"></div>กำลังเชื่อมต่อ HDC API สุโขทัย…</div>
    </div>
  </div>
  <div class="panel" id="panel-ksp">
    <div id="ksp-content">
      <div class="loading-state"><div class="spinner"></div>กำลังดึงข้อมูล กสป…</div>
    </div>
  </div>

  <div class="footer">
    ดึงข้อมูลสดผ่าน MOPH OpenData API · ระบบ GAS Proxy · Telemedicine Dashboard v6.0<br>
    ผู้ดูแลระบบ: อนันต์ มิตคำ
  </div>
</div>

<script>
/* ── CONFIG ── */
const GAS_PROXY_URL = 'https://script.google.com/macros/s/AKfycbzPyoYFPH0Ud2IwBSLQI6dIbT-zp8qFp3QNETKFam_WykN3hhho6d1MmpRimLdROjY14w/exec';
const SHEET_ID  = '1nQ0rWhnqWnd1YlXK-ISKgx6Atv3hUV08o5B0_A05v74';
const SHEET_KSP = 'กสป';

// ══════════════════════════════════════════════════════
// รหัส hospcode ของทุกหน่วยบริการในอำเภอกงไกรลาศ
// areacode ขึ้นต้นด้วย "6406" = อำเภอกงไกรลาศ (จ.สุโขทัย 64, อำเภอ 06)
// ══════════════════════════════════════════════════════
const KK_HOSPCODES = new Set([
  '07402', '07403', '07404', '07405', '07406',
  '07407', '07408', '07409', '07410', '07411',
  '07412', '07413', '07414', '07415', '11246',
  '14047'
  // ถ้ายังขาดตัวไหน ระบบจะ fallback กรองด้วย areacode 6406 แทน
]);

// แผนที่ hospcode → ชื่อหน่วยบริการ (ใช้แสดงในตาราง)
const HOSP_NAMES = {
  '07402': 'รพ.สต.บ้านประดู่เฒ่า',
  '07403': 'รพ.สต.กง',
  '07404': 'รพ.สต.ไกรนอก',
  '07405': 'รพ.สต.ไกรกลาง',
  '07406': 'รพ.สต.ไกรใน',
  '07407': 'รพ.สต.บ้านหนองกระทุ่ม',
  '07408': 'รพ.สต.ดงเดือย',
  '07409': 'รพ.สต.ป่าแฝก',
  '07410': 'รพ.สต.บ้านปรักรัก',
  '07411': 'รพ.สต.บ้านกกแรต',
  '07412': 'รพ.สต.บ้านท่าฉนวน',
  '07413': 'รพ.สต.บ้านน้ำเรื่อง',
  '07414': 'รพ.สต.หนองตูม',
  '07415': 'รพ.สต.บ้านใหม่สุขเกษม',
  '11246': 'ร.พ.กงไกรลาศ',
  '14047': 'รพ.สต.บ้านหนองหลอด'
};

let hdcChart = null, kspChart = null;

/* ── Helpers ── */
function num(v){
  if(v==null||v==='') return 0;
  const n=parseFloat(String(v).replace(/,/g,''));
  return isNaN(n)?0:n;
}
function updateDate(){
  document.getElementById('dateBadge').textContent='📅 '+
    new Date().toLocaleDateString('th-TH',{year:'numeric',month:'long',day:'numeric',weekday:'long',timeZone:'Asia/Bangkok'});
}
window.switchTab=function(name,btn){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('panel-'+name).classList.add('active');
};
function summaryCard(icon,label,val,delta,sub,cls){
  const d=delta>0?`<span class="card-delta delta-up">▲ +${Number(delta).toLocaleString()}</span>`
           :delta<0?`<span class="card-delta delta-down">▼ ${Number(delta).toLocaleString()}</span>`:'';
  return `<div class="summary-card ${cls}">
    <div class="card-icon">${icon}</div>
    <div class="card-label">${label}</div>
    <div class="card-value">${val}</div>${d}
    <div class="card-sub">${sub}</div></div>`;
}
function errorHTML(msg,debug){
  const dbg=debug?`<div class="debug-box">${debug}</div>`:'';
  return `${dbg}<div class="loading-state">
    <div style="font-size:2rem;margin-bottom:12px">⚠️</div>
    <p style="color:#ff6b6b">${msg}</p>
    <button class="refresh-btn" style="margin-top:16px" onclick="loadAllData()">ลองใหม่</button>
  </div>`;
}

/* ══════════════════════════════════════════
   FETCH HDC ผ่าน JSONP (ไม่มี CORS เลย)
══════════════════════════════════════════ */
function fetchHdcApi(){
  return new Promise((resolve,reject)=>{
    const cbName='gasCallback_'+Date.now();
    const timer=setTimeout(()=>{
      delete window[cbName];
      script.parentNode&&script.parentNode.removeChild(script);
      reject(new Error('Timeout 15 วินาที'));
    },15000);

    window[cbName]=function(data){
      clearTimeout(timer);
      delete window[cbName];
      script.parentNode&&script.parentNode.removeChild(script);
      data&&data.error?reject(new Error(data.error)):resolve(data);
    };

    const params=new URLSearchParams({
      table:'s_telemed_hosp',year:'2569',province:'64',type:'json',callback:cbName
    });
    const script=document.createElement('script');
    script.src=GAS_PROXY_URL+'?'+params.toString();
    script.onerror=()=>{
      clearTimeout(timer);delete window[cbName];
      reject(new Error('โหลด Script ไม่ได้ — ตรวจสอบ GAS URL และ Deploy settings'));
    };
    document.head.appendChild(script);
  });
}

/* ══════════════════════════════════════════
   RENDER HDC — กรองด้วย hospcode/areacode
══════════════════════════════════════════ */
function renderHdcFromApi(jsonData){
  let all=[];
  if(Array.isArray(jsonData))          all=jsonData;
  else if(Array.isArray(jsonData?.data))   all=jsonData.data;
  else if(Array.isArray(jsonData?.result)) all=jsonData.result;

  if(!all.length){
    document.getElementById('hdc-content').innerHTML=
      errorHTML('เชื่อมต่อได้ แต่ไม่พบข้อมูล',JSON.stringify(jsonData).substring(0,400));
    return;
  }

  // ── ขั้นตอนที่ 1: กรองด้วย KK_HOSPCODES ก่อน
  let kkData=all.filter(r=>KK_HOSPCODES.has(String(r.hospcode||r.HOSPCODE||'').trim()));

  // ── ขั้นตอนที่ 2: ถ้าไม่เจอเลย → fallback กรองด้วย areacode ขึ้นต้น "6406"
  if(!kkData.length){
    kkData=all.filter(r=>{
      const ac=String(r.areacode||r.AREACODE||'').trim();
      return ac.startsWith('6406');
    });
  }

  // ── ยังไม่เจออีก → แสดง debug
  if(!kkData.length){
    const sample=JSON.stringify(all.slice(0,3),null,2);
    document.getElementById('hdc-content').innerHTML=
      errorHTML(`พบข้อมูล ${all.length} รายการ แต่หากรองกงไกรลาศไม่เจอ`,
        'ตัวอย่าง 3 แถวแรก (ดู field hospcode และ areacode):\n'+sample);
    return;
  }

  // ── รวมผลลัพธ์ตาม hospcode (กรณีมีหลาย row ต่อ hosp)
  const byHosp={};
  kkData.forEach(r=>{
    const hc=String(r.hospcode||r.HOSPCODE||'').trim();
    const val=num(r.result||r.RESULT||r.value||r.VALUE||0);
    if(!byHosp[hc]) byHosp[hc]={hospcode:hc,total:0,rows:[]};
    byHosp[hc].total+=val;
    byHosp[hc].rows.push(r);
  });

  const hosps=Object.values(byHosp);
  let totAll=0,totRph=0,totHos=0;
  hosps.forEach(h=>{
    totAll+=h.total;
    const name=HOSP_NAMES[h.hospcode]||('รหัส '+h.hospcode);
    if(name.includes('รพ.สต')||name.includes('ส่งเสริม')) totHos+=h.total;
    else totRph+=h.total;
  });

  document.getElementById('hdc-content').innerHTML=`
    <div class="summary-grid">
      ${summaryCard('🏥','ยอดรวมทั้งอำเภอ (API)',totAll.toLocaleString(),0,'ปี 2569','c1')}
      ${summaryCard('🏢','รพ.กงไกรลาศ (API)',totRph.toLocaleString(),0,'สะสม','c2')}
      ${summaryCard('🏘️','รวม รพ.สต. (API)',totHos.toLocaleString(),0,'สะสม','c3')}
      ${summaryCard('📍','จำนวนหน่วยบริการ',hosps.length,0,'แห่ง','c4')}
    </div>
    <div class="section-title">📊 กราฟผลงานรายหน่วยบริการ (HDC API)</div>
    <div class="chart-card"><canvas id="hdcBarChart"></canvas></div>
    <div class="section-title">📋 ตารางผลงานหน่วยบริการ</div>
    <div class="table-card"><table>
      <thead><tr>
        <th>#</th><th>รหัส hospcode</th><th>หน่วยบริการ</th><th>ผลงานสะสม (ครั้ง)</th>
      </tr></thead>
      <tbody id="hdc-tbody"></tbody>
    </table></div>`;

  const sorted=[...hosps].sort((a,b)=>b.total-a.total);
  const tbody=document.getElementById('hdc-tbody');
  sorted.forEach((h,i)=>{
    const name=HOSP_NAMES[h.hospcode]||('รหัส '+h.hospcode);
    tbody.innerHTML+=`<tr>
      <td style="color:var(--text-muted)">${i+1}</td>
      <td style="color:var(--text-muted);font-family:monospace">${h.hospcode}</td>
      <td><strong>${name}</strong></td>
      <td><strong>${h.total.toLocaleString()}</strong></td></tr>`;
  });

  if(hdcChart) hdcChart.destroy();
  hdcChart=new Chart(document.getElementById('hdcBarChart').getContext('2d'),{
    type:'bar',
    data:{
      labels:sorted.map(h=>HOSP_NAMES[h.hospcode]||h.hospcode),
      datasets:[{label:'ยอดสะสม (ครั้ง)',data:sorted.map(h=>h.total),
        backgroundColor:'rgba(0,198,255,0.7)',borderRadius:8}]
    },
    options:{responsive:true,
      plugins:{legend:{labels:{color:'#fff',font:{family:'Sarabun'}}}},
      scales:{
        x:{ticks:{color:'rgba(255,255,255,.65)',font:{family:'Sarabun'},maxRotation:45}},
        y:{ticks:{color:'rgba(255,255,255,.65)',font:{family:'Sarabun'}}}
      }
    }
  });
}

/* ══ FETCH + RENDER กสป ══ */
async function fetchSheetFixed(sheetName){
  const url=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(sheetName)}`;
  const res=await fetch(url);
  if(!res.ok) throw new Error(`HTTP ${res.status}`);
  const text=await res.text();
  return new Promise((resolve,reject)=>{
    Papa.parse(text,{header:false,skipEmptyLines:true,
      complete:r=>resolve(r.data),error:e=>reject(e)});
  });
}

function renderKSP(rows){
  if(!rows||rows.length<2){
    document.getElementById('ksp-content').innerHTML=errorHTML('ไม่พบข้อมูลในชีต กสป');return;
  }
  let dataStart=1;
  for(let i=0;i<Math.min(10,rows.length);i++){
    const fc=(rows[i][0]||'').trim();
    if(fc&&(fc.startsWith('รพ')||fc.includes('กงไกรลาศ'))&&
       !fc.includes('สถานบริการ')&&!fc.includes('อำเภอ')){dataStart=i;break;}
  }
  let header=[],maxCols=0;
  for(let i=0;i<dataStart;i++) if(rows[i].length>maxCols) maxCols=rows[i].length;
  for(let c=0;c<maxCols;c++){
    let n='';
    for(let r=0;r<dataStart;r++) if(rows[r][c]&&rows[r][c].trim()!=='') n=rows[r][c].trim();
    header[c]=n;
  }
  const hl=header.map(h=>(h||'').toLowerCase());
  let colD=hl.findIndex(h=>h.includes('อำเภอ')||h.includes('สถานบริการ')||h.includes('หน่วยบริการ'));
  if(colD===-1) colD=0;
  let colL=header.length-1;
  while(colL>colD&&(!header[colL]||header[colL]===''||header[colL].toLowerCase()==='ผลงาน')) colL--;
  let colP=colL>colD+1?colL-1:colL;

  const data=rows.slice(dataStart).filter(r=>r[colD]&&r[colD].trim()!==''&&!r[colD].includes('รวม'));
  let totAll=0,prevAll=0,totRph=0,totHos=0;
  data.forEach(r=>{
    const v=num(r[colL]),p=num(r[colP]),n=r[colD]||'';
    totAll+=v;prevAll+=p;
    if(n.includes('รพ.สต')) totHos+=v; else totRph+=v;
  });

  document.getElementById('ksp-content').innerHTML=`
    <div class="summary-grid">
      ${summaryCard('🏥','ยอดรวมทั้งอำเภอ (กสป)',totAll.toLocaleString(),totAll-prevAll,`อัปเดต: ${header[colL]||'ล่าสุด'}`,'c1')}
      ${summaryCard('🏢','รพ.กงไกรลาศ (กสป)',totRph.toLocaleString(),0,'สะสม','c2')}
      ${summaryCard('🏘️','รวม รพ.สต. (กสป)',totHos.toLocaleString(),0,'สะสม','c3')}
      ${summaryCard('📍','จำนวนหน่วยบริการ',data.length,0,'แห่ง','c4')}
    </div>
    <div class="section-title">📊 กราฟผลงานรายหน่วยบริการ (${header[colL]||'ล่าสุด'})</div>
    <div class="chart-card"><canvas id="kspBarChart"></canvas></div>
    <div class="section-title">📋 ตารางเปรียบเทียบ</div>
    <div class="table-card"><table>
      <thead><tr><th>#</th><th>หน่วยบริการ</th>
        <th>ยอดก่อนหน้า<br><span style="font-size:.65rem;opacity:.7">${header[colP]||'ก่อนหน้า'}</span></th>
        <th>ยอดล่าสุด<br><span style="font-size:.65rem;color:var(--accent3)">${header[colL]||'ล่าสุด'}</span></th>
        <th>ส่วนต่าง</th></tr></thead>
      <tbody id="ksp-tbody"></tbody>
    </table></div>`;

  const sorted=[...data].sort((a,b)=>num(b[colL])-num(a[colL]));
  const tbody=document.getElementById('ksp-tbody');
  sorted.forEach((r,i)=>{
    const p=num(r[colP]),t=num(r[colL]),d=t-p;
    const badge=d>0?`<span class="tag-up">+${d.toLocaleString()}</span>`
                :d<0?`<span class="tag-down">${d.toLocaleString()}</span>`
                :`<span class="tag-zero">±0</span>`;
    tbody.innerHTML+=`<tr>
      <td style="color:var(--text-muted)">${i+1}</td>
      <td><strong>${r[colD]||''}</strong></td>
      <td>${p.toLocaleString()}</td>
      <td><strong>${t.toLocaleString()}</strong></td>
      <td>${badge}</td></tr>`;
  });

  if(kspChart) kspChart.destroy();
  kspChart=new Chart(document.getElementById('kspBarChart').getContext('2d'),{
    type:'bar',
    data:{labels:sorted.map(r=>r[colD]||''),
      datasets:[{label:`ยอดรวม (${header[colL]||'ล่าสุด'})`,data:sorted.map(r=>num(r[colL])),
        backgroundColor:'rgba(162,96,233,0.7)',borderRadius:8}]},
    options:{responsive:true,
      plugins:{legend:{labels:{color:'#fff',font:{family:'Sarabun'}}}},
      scales:{
        x:{ticks:{color:'rgba(255,255,255,.65)',font:{family:'Sarabun'},maxRotation:45}},
        y:{ticks:{color:'rgba(255,255,255,.65)',font:{family:'Sarabun'}}}
      }
    }
  });
}

/* ══ MAIN ══ */
async function loadAllData(){
  updateDate();
  document.getElementById('hdc-content').innerHTML=
    '<div class="loading-state"><div class="spinner"></div>กำลังดึงข้อมูลจากกระทรวงสาธารณสุข...</div>';
  document.getElementById('ksp-content').innerHTML=
    '<div class="loading-state"><div class="spinner"></div>กำลังดึงข้อมูล กสป…</div>';

  fetchHdcApi().then(renderHdcFromApi).catch(e=>{
    console.error(e);
    document.getElementById('hdc-content').innerHTML=
      errorHTML('โหลดข้อมูล API HDC ไม่สำเร็จ: '+e.message);
  });

  fetchSheetFixed(SHEET_KSP).then(renderKSP).catch(e=>{
    document.getElementById('ksp-content').innerHTML=
      errorHTML('โหลดข้อมูล กสป ไม่สำเร็จ: '+e.message);
  });
}

window.onload=loadAllData;
</script>
